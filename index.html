<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muscle Atlas — Interactive 3D Human Musculature</title>
  <meta name="description" content="An interactive 3D explorer of the major human muscle groups. Click any muscle to learn its anatomy, function, and how to train it.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F9B4;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and the Draco decoder are served from this repo, not a CDN:
       a blocked or slow third-party host would otherwise leave the page
       with its interface but no anatomy. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="masthead">
      <h1>Muscle<br>Atlas</h1>
      <p class="tagline">Interactive 3D human anatomy</p>
      <nav class="system-tabs" id="systemTabs" aria-label="Body systems"></nav>
    </header>

    <nav class="muscle-list" id="muscleList" aria-label="Muscle groups"></nav>

    <aside class="info-card" id="infoCard" hidden>
      <button class="info-close" id="infoClose" aria-label="Close panel">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
      <p class="info-region" id="infoRegion"></p>
      <h2 class="info-name" id="infoName"></h2>
      <p class="info-latin" id="infoLatin"></p>
      <p class="info-desc" id="infoDesc"></p>
      <h3 class="info-sub">Function</h3>
      <p class="info-fn" id="infoFn"></p>
      <h3 class="info-sub" id="noteHead">Worth knowing</h3>
      <p class="info-fn" id="infoNote"></p>
      <h3 class="info-sub" id="bwHead">Bodyweight &amp; calisthenics</h3>
      <ul class="info-exercises" id="infoBodyweight"></ul>
      <h3 class="info-sub" id="wtHead">With weights</h3>
      <ul class="info-exercises" id="infoWeights"></ul>
    </aside>

    <div id="loading">Loading anatomy&hellip;</div>

    <button class="view-reset" id="viewReset" title="Reset the camera">Reset view</button>

    <a class="credit" href="https://www.z-anatomy.com/" target="_blank" rel="noopener">
      Model: Z-Anatomy / BodyParts3D &middot; CC BY-SA
    </a>

    <footer class="hints">
      <span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v6M10 9l-2.5-2.5M10 9l2.5-2.5"/><circle cx="10" cy="14" r="3.2"/></svg> drag to rotate</span>
      <span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4v12M6.5 7.5L10 4l3.5 3.5M6.5 12.5L10 16l3.5-3.5"/></svg> scroll to zoom</span>
      <span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg> click a part</span>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>
  <script>
    // If the 3D engine or the model never arrives, say so rather than
    // leaving an empty scene behind the interface.
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el || window.__atlasReady) return;
      el.classList.add('stalled');
      el.textContent = window.__atlasProgress
        ? 'Still loading the model — slow connection?'
        : 'The 3D engine could not start. Try a reload, or a different browser.';
    }, 20000);
  </script>
</body>
</html>
